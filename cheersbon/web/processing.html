<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Processing</title>
  <style>
    body { font-family: "Segoe UI", sans-serif; background: #fafafa; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
    .loader { border: 6px solid #eee; border-top: 6px solid #ff5722; border-radius: 50%; width: 60px; height: 60px; animation: spin 1s linear infinite; margin-bottom: 20px; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    h2 { color: #333; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="loader"></div>
  <h2 id="processingMsg">⏳ Initializing Payment...</h2>

  <script>
    const params = new URLSearchParams(window.location.search);
    const txnId = params.get("txnId");
    const amount = params.get("amount");
    const item = params.get("item");

    const messages = [
      "🔄 Payment request is being created...",
      "📲 Redirecting to your UPI app..."
    ];
    let i = 0;
    const msgElement = document.getElementById("processingMsg");
    setInterval(() => {
      msgElement.textContent = messages[i];
      i = (i + 1) % messages.length;
    }, 2000);

    // After few sec → open UPI app
    setTimeout(() => {
      const upiLink =
        "upi://pay?pa=merchant@upi&pn=BonusHub&mc=0000&tid=" + txnId +
        "&tr=" + txnId + "&tn=" + encodeURIComponent(item) +
        "&am=" + amount + "&cu=INR" +
        "&url=https://yourdomain.com/success.html";

      window.location.href = upiLink; // open payment app
    }, 4000);
  </script>
</body>
</html>
