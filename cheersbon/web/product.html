<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      text-align: center;
    }
    .card {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 20px;
      max-width: 300px;
      margin: auto;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    button {
      background: #4CAF50;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background: #45a049;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Sample Product</h2>
    <p>Price: ₹499</p>
    <button onclick="goToSuccess()">Buy Now</button>
  </div>

  <script>
    function goToSuccess() {
      const txnId = "TXN" + Math.floor(Math.random() * 1000000);
      const amount = 499;
      const status = "Success";
      window.location.href = "success.html?txnId=" + txnId + "&amount=" + amount + "&status=" + status;
    }
  </script>

</body>
</html>
