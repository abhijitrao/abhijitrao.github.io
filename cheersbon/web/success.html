<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Success</title>
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: #f1f8e9;
      text-align: center;
      padding: 30px;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .success {
      color: #4caf50;
      font-size: 22px;
      margin-top: 20px;
    }
    .details {
      margin-top: 20px;
      background: white;
      padding: 15px 25px;
      border-radius: 12px;
      display: inline-block;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      text-align: left;
    }
    .details img {
      width: 100px;
      border-radius: 8px;
      float: left;
      margin-right: 15px;
    }
    /* Bottom fixed button */
    .home-btn {
      width: 100%;
      background: #2196F3;
      color: white;
      padding: 15px;
      border: none;
      border-radius: 0;
      font-size: 18px;
      cursor: pointer;
      position: fixed;
      bottom: 0;
      left: 0;
    }
    .home-btn:hover {
      background: #1976d2;
    }
  </style>
</head>
<body>

  <div>
    <h2 class="success">✅ Order Confirmed!</h2>
    <div class="details">
      <img src="https://cdn.pixabay.com/photo/2017/12/09/08/18/pizza-3007395_1280.jpg" alt="Pizza">
      <div>
        <p><b>Item:</b> <span id="item"></span></p>
        <p><b>Order ID:</b> <span id="txnId"></span></p>
        <p><b>Amount:</b> ₹<span id="amount"></span></p>
        <p><b>Status:</b> <span id="status"></span></p>
      </div>
    </div>
  </div>

  <button class="home-btn" onclick="window.location.href='product.html'">🏠 Home</button>

  <script>
    const params = new URLSearchParams(window.location.search);
    document.getElementById("txnId").textContent = params.get("txnId");
    document.getElementById("amount").textContent = params.get("amount");
    document.getElementById("status").textContent = params.get("status");
    document.getElementById("item").textContent = params.get("item");
  </script>

</body>
</html>
